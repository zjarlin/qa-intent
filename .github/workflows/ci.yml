name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: qai-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/qai
            target/${{ matrix.target }}/release/qai.exe

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage binaries
        run: |
          mkdir -p bin-dir/aarch64-apple-darwin bin-dir/x86_64-apple-darwin \
                   bin-dir/x86_64-unknown-linux-gnu bin-dir/aarch64-unknown-linux-gnu \
                   bin-dir/x86_64-pc-windows-msvc
          cp artifacts/qai-aarch64-apple-darwin/qai bin-dir/aarch64-apple-darwin/qai
          cp artifacts/qai-x86_64-apple-darwin/qai bin-dir/x86_64-apple-darwin/qai
          cp artifacts/qai-x86_64-unknown-linux-gnu/qai bin-dir/x86_64-unknown-linux-gnu/qai
          cp artifacts/qai-aarch64-unknown-linux-gnu/qai bin-dir/aarch64-unknown-linux-gnu/qai
          cp artifacts/qai-x86_64-pc-windows-msvc/qai.exe bin-dir/x86_64-pc-windows-msvc/qai.exe
          chmod +x bin-dir/*/qai

      - name: Generate platform packages
        env:
          BIN_DIR: ${{ github.workspace }}/bin-dir
        run: node npm/scripts/gen-platform-packages.mjs

      # 认证方式二选一（本步骤两者都兼容）：
      # 1) Trusted Publisher：在 npmjs.com 为每个包配置 GitHub Actions 发布者
      #    （repository=zjarlin/qa-intent, workflow=ci.yml），无需 NPM_TOKEN；
      # 2) NPM_TOKEN：在仓库添加 NPM_TOKEN secret（Automation token）。
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in dist/npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "跳过 $name@$version（已发布）"
              continue
            fi
            (cd "$dir" && npm publish --access public --provenance)
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "跳过 $name@$version（已发布）"
            exit 0
          fi
          npm publish --access public --provenance
