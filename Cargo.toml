[package]
name = "qa-intent"
version = "0.2.0"
edition = "2021"
description = "Generate structured QA banks from scenarios, export customer-service data and compile Laya/JEV decisions"
license = "MIT"

[[bin]]
name = "qai"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
csv = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
